---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  chart:
    spec:
      ## version pinned in prod to prevent automatic updates
      version: "0.125.0"
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: ""
              version: v1
              kind: ConfigMap
              name: otel-collector-opentelemetry-collector-agent
            patch: |
              - op: replace
                path: /data/relay
                value: |
                  exporters:
                    debug: {}
                    otlp:
                      endpoint: gateway.tempo.devops.core.sis.tv:443
                  extensions:
                    health_check:
                      endpoint: ${env:MY_POD_IP}:13133
                  processors:
                    batch: {}
                    k8sattributes:
                      extract:
                        metadata:
                        - k8s.namespace.name
                        - k8s.deployment.name
                        - k8s.statefulset.name
                        - k8s.daemonset.name
                        - k8s.cronjob.name
                        - k8s.job.name
                        - k8s.node.name
                        - k8s.pod.name
                        - k8s.pod.uid
                        - k8s.pod.start_time
                      filter:
                        node_from_env_var: K8S_NODE_NAME
                      passthrough: false
                      pod_association:
                      - sources:
                        - from: resource_attribute
                          name: k8s.pod.ip
                      - sources:
                        - from: resource_attribute
                          name: k8s.pod.uid
                      - sources:
                        - from: connection
                    memory_limiter:
                      check_interval: 5s
                      limit_percentage: 80
                      spike_limit_percentage: 25
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                          endpoint: ${env:MY_POD_IP}:4317
                        http:
                          endpoint: ${env:MY_POD_IP}:4318
                  service:
                    extensions:
                    - health_check
                    pipelines:
                      traces:
                        exporters:
                        - otlp
                        processors:
                        - k8sattributes
                        - memory_limiter
                        - batch
                        receivers:
                        - otlp
                    telemetry:
                      metrics:
                        readers:
                        - pull:
                            exporter:
                              prometheus:
                                host: ${env:MY_POD_IP}
                                port: 8888

  values:
    ## Due to limitation in flux kustomize, we replace the 
    ## templated config map with the correct values shown above.
    ## This limitation does not exist in helm, which
    ## processes the helm values under the config key below correctly.

    ## I have left the below values as-is for reference.
    ## But note that the config map is completely replaced by
    ## the patch by the post renderer shown above. 
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:4317
            http:
              endpoint: ${env:MY_POD_IP}:4318
        jaeger: null
        prometheus: null
        zipkin: null

      ## define tempo gateway as endpoint for otlp exporter
      exporters:
        otlp:
          ## TODO: add client auth for tempo gateway
          endpoint: gateway.tempo.devops.core.sis.tv:443

      service:
        pipelines:
          ## disable metric and log pipelines
          ## these are handled by promtail or prometheus
          metrics: null
          logs: null
          traces:
            receivers: [otlp]
            exporters: [otlp]

    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

    ## set to true with a resource memory limit so
    ## that runtime doesn't exceed 90% of mem limit
    useGOMEMLIMIT: true

    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi

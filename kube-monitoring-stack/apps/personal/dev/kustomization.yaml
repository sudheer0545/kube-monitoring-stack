---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: not-important
resources:
  - ../../base/prometheus-stack
patches:
  - path: prometheus-values.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2beta1
      kind: HelmRelease
      name: prometheus-stack

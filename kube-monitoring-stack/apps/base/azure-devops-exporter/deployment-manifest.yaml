apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: azure-devops-exporter
    app.kubernetes.io/name: azure-devops-exporter
  name: azure-devops-exporter
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: azure-devops-exporter
      app.kubernetes.io/name: azure-devops-exporter
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: azure-devops-exporter
        app.kubernetes.io/name: azure-devops-exporter
    spec:
      automountServiceAccountToken: false
      containers:
      - image: webdevops/azure-devops-exporter:24.6.0
        imagePullPolicy: IfNotPresent
        name: azure-devops-exporter
        env:
          - name: AZURE_DEVOPS_ACCESS_TOKEN
            valueFrom:
              secretKeyRef: 
                name: azure-devops-exporter-auth
                key: AZURE_DEVOPS_PAT
          - name: AZURE_DEVOPS_ORGANISATION
            value: "SIS-Betting"
          - name: AZURE_DEVOPS_APIVERSION
            value: 7.2-preview.1
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 100Mi
          requests:
            memory: 50Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

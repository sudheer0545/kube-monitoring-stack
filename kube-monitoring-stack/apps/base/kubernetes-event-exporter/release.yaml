---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-event-exporter
  namespace: monitoring
spec:
  chartRef:
    kind: OCIRepository
    name: kubernetes-event-exporter
    namespace: monitoring
  interval: 5m
  values:
    ## to use custom images we need to override
    ## the global allowInsecureImages value
    global:
      security:
        allowInsecureImages: true

    image:
      registry: acrsisdev.azurecr.io
      repository: kubernetes-event-exporter

    resources:
      requests:
        cpu: 150m
        memory: 128Mi
      limits:
        cpu: 1200m
        memory: 1024Mi

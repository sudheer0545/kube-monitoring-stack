apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: personal-dev-apps
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  dependsOn:
    - name: personal-dev-infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kube-monitoring-stack/apps/personal/dev
